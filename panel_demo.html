<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Panel Demo</title>
<style>
  /* Designed for a 64x64 LED panel: the mirror centre-crops a square out of the
     screen, so everything lives in a centred square and uses huge bold shapes.
     Fine detail and small text are invisible at this size — big blocks are not. */
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vmin;height:100vmin;background:#000;}
  canvas{position:absolute;inset:0;width:100%;height:100%;}
  #clock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
         font-family:-apple-system,Helvetica,Arial,sans-serif;font-weight:800;
         font-size:26vmin;letter-spacing:-0.02em;color:#fff;
         text-shadow:0 0 6vmin rgba(0,0,0,.9);}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="clock">--:--</div>
</div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
function size(){ cv.width=cv.height=256; }
size();

// Big soft colour blobs — reads well once shrunk to 64x64.
const blobs=[...Array(5)].map((_,i)=>({
  x:Math.random()*256, y:Math.random()*256,
  vx:(Math.random()-.5)*1.1, vy:(Math.random()-.5)*1.1,
  r:60+Math.random()*50,
  hue:i*70
}));

function draw(t){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,256,256);
  ctx.globalCompositeOperation='lighter';
  for(const b of blobs){
    b.x+=b.vx; b.y+=b.vy;
    if(b.x<0||b.x>256) b.vx*=-1;
    if(b.y<0||b.y>256) b.vy*=-1;
    const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
    const h=(b.hue+t/60)%360;
    g.addColorStop(0,`hsla(${h},100%,55%,0.95)`);
    g.addColorStop(1,`hsla(${h},100%,50%,0)`);
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function tick(){
  const d=new Date();
  let h=d.getHours()%12||12;
  document.getElementById('clock').textContent=
    h+':'+String(d.getMinutes()).padStart(2,'0');
}
tick(); setInterval(tick,1000);
</script>
</body>
</html>
